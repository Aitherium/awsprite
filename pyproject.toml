[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "awsprite"
version = "0.2.0"
description = "A portable client for AitherSprite-shaped companion services — status, talk, teach, and watch what it becomes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Stdlib-only by design (aw-family client rule): the one network call is
# urllib. No requests, no pydantic, no httpx — a stranger's machine must
# be able to install this with nothing else present.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
awsprite = "awsprite.cli:main"

[project.urls]
Homepage = "https://github.com/Aitherium/awsprite"
Documentation = "https://github.com/Aitherium/awsprite#readme"
Repository = "https://github.com/Aitherium/awsprite.git"
Issues = "https://github.com/Aitherium/awsprite/issues"

[tool.setuptools]
packages = ["awsprite"]
license-files = ["LICENSE"]

# The homestead embed script ships inside the package (awsprite.embed reads it
# through importlib.resources), so a wheel without it would be a broken embed.
[tool.setuptools.package-data]
awsprite = ["web/*.js"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501", "E402", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
